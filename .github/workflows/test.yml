name: test

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve source bytes and links
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: "2026.6.2"
          install: "true"
          # mise's cache omits the rustup toolchains behind its Rust links.
          cache: "false"
      - name: Restore compiled dependencies
        id: cargo-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: native-test-${{ hashFiles('.mise.toml', 'tools/build.py', 'tools/cc', 'tools/ar') }}
          cache-bin: "false"
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Report dependency cache
        run: echo '::notice::Cargo dependency cache hit = ${{ steps.cargo-cache.outputs.cache-hit }}'
      - name: Formatting and Clippy
        run: |
          mkdir -p .source-down/test-logs
          cargo fmt --all -- --check 2>&1 | tee .source-down/test-logs/formatting.log
          python tools/build.py -- cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee .source-down/test-logs/clippy.log
      - name: All native tests
        run: |
          mkdir -p .source-down/test-logs
          python tools/build.py -- python tools/test.py --no-coverage 2>&1 | tee .source-down/test-logs/tests.log
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-evidence-${{ matrix.os }}
          path: |
            .source-down/test-logs/
            .source-down/test-runs/
            .source-down/e2e/runs/
            .source-down/coverage/
            .source-down/watch-benchmark/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
